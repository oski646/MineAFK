[project]
name = "mineafk"
version = "0.8.0b0"
description = "Script which allows people to automatically dig stone and collect resources."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [
    { name = "oski646", email = "me.oski646@gmail.com" },
]
dependencies = [
    "pynput>=1.8.2,<2.0.0",
    "pywin32>=311,<312; sys_platform == 'win32'",
    "requests>=2.34.2,<3.0.0",
]

[dependency-groups]
build = [
    "pyinstaller>=6.20.0,<7.0.0",
]

[tool.uv]
package = false
